
name: Build ScrollVerse APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ScrollVerseBible_Android_Starter.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q ScrollVerseBible_Android_Starter.zip -d android-project

      - name: Build APK
        run: gradle -p android-project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScrollVerse-debug-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
