
name: Build ScrollVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ScrollVerseBible_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project ZIP
        run: |
          echo "Checking uploaded project..."
          test -f ScrollVerseBible_Android_Starter.zip
          unzip -t ScrollVerseBible_Android_Starter.zip

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q ScrollVerseBible_Android_Starter.zip \
            -d android-project

      - name: Verify project structure
        run: |
          test -f android-project/settings.gradle.kts
          test -f android-project/build.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/app/src/main/AndroidManifest.xml
          echo "Project structure verified."

      - name: Build debug APK
        run: |
          gradle -p android-project \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify generated APK
        run: |
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollVerse-debug-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
