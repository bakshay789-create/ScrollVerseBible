name: Build ScrollVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ScrollVerseBible_Android_Starter.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify project ZIP
        run: |
          echo "Checking uploaded project..."
          test -f ScrollVerseBible_Android_Starter.zip
          unzip -t ScrollVerseBible_Android_Starter.zip

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q ScrollVerseBible_Android_Starter.zip -d android-project

      - name: Verify project structure
        run: |
          test -f android-project/settings.gradle.kts
          test -f android-project/build.gradle.kts
          test -f android-project/app/build.gradle.kts
          test -f android-project/app/src/main/AndroidManifest.xml
          echo "Project structure verified."

      - name: Build debug APK
        run: |
          gradle -p android-project \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        run: |
          test -f android-project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollVerse-debug-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

### 2. Replace the file on GitHub

On your Android phone:

1. Open your GitHub repository, `ScrollVerseBible`.
2. Open `.github/workflows/build-apk.yml`.
3. Tap the pencil icon to edit.
4. Select the existing file contents and replace them with the complete YAML above. Copy only the YAML text, not the surrounding explanation or Markdown code fences.
5. Scroll down and commit the changes to the `main` branch.

### 3. Check your ZIP filename

Your repository must contain this file at its root:

`ScrollVerseBible_Android_Starter.zip`

**Important:** The ZIP must contain the updated Android project, not the old starter project. Updating the workflow alone will not add the new Bible study plan, themes, icon, or other app features.

### 4. Build and download the APK

1. Open **Actions** in GitHub.
2. Select **Build ScrollVerse APK**.
3. Open the latest run and wait for a green check mark.
4. Under **Artifacts**, download `ScrollVerse-debug-APK`.
5. Extract the downloaded artifact ZIP and install `app-debug.apk` on your phone.

If the build fails, send me a screenshot of the failed step. We can then fix the specific error without changing unrelated parts of your project.
